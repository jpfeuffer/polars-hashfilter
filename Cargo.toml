[package]
name = "polars_hashfilter"
version = "0.2.0"
edition = "2021"

[lib]
name = "polars_hashfilter"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.55.2", default-features = false, features = ["lazy"] }
polars-core = { version = "0.55.2" }
polars-arrow = { version = "0.55.2" }
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-polars = { version = "0.28", features = ["derive", "lazy"] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
