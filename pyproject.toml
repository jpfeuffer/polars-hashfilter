[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars-hashfilter"
version = "0.1.1"
description = "Polars plugin exposing PlHashSet for efficient filtering with persistent sets across LazyFrames"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["polars>=1.0"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "polars_hashfilter._internal"
python-source = "python"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
